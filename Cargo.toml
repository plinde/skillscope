[package]
name = "skillscope"
version = "0.1.0"
edition = "2024"
description = "Claude Code skill-invocation analytics — local JSONL transcripts only"
license = "MIT"
repository = "https://github.com/plinde/skillscope"

[lib]
name = "skillscope"
path = "src/lib.rs"

[[bin]]
name = "skillscope"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
