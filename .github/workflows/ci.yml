name: CI

# Gates every PR. `auto-merge.yml` keys off this workflow's name — rename it
# there too if you rename it here, or auto-merge silently stops firing.
#
# Steps delegate to the Makefile rather than restating cargo invocations, so
# `make fmt-check lint test` locally and CI cannot drift apart.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: make fmt-check

      - name: Clippy
        run: make lint

      - name: Test
        run: make test
