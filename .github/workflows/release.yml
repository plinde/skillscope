name: Release

# A `v*` tag builds skillscope for each Homebrew target, publishes a GitHub
# Release with the tarballs, and pushes Formula/skillscope.rb to the private
# tap plinde/homebrew-tap-private. Nothing releases without a tag.
#
# Same trust stance as ci.yml: no third-party actions. rustup on the runners
# reads rust-toolchain.toml; the release and tap push are plain gh/git.
#
# Targets:
#   aarch64-apple-darwin       sickboy, renton. Ad-hoc codesigned: the kernel
#                              kills unsigned arm64 Mach-O binaries.
#   x86_64-unknown-linux-musl  behemoth. Static, so it runs on any glibc
#                              (behemoth is Ubuntu 18.04, glibc 2.27).
#
# Needs the TAP_GITHUB_TOKEN repo secret (Contents:write on the tap).

on:
  push:
    tags: ["v*"]
  # PRs touching the build inputs, and manual runs, build + smoke only (no release, no tap
  # push), so a broken target shows up before the tag.
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != Cargo.toml $want"; exit 1; }

      - name: Install pinned toolchain and target
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Codesign (ad-hoc)
        if: runner.os == 'macOS'
        run: codesign --force --sign - target/${{ matrix.target }}/release/skillscope

      - name: Smoke
        run: target/${{ matrix.target }}/release/skillscope --version

      - name: Package
        run: tar -czf skillscope-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release skillscope

      - uses: actions/upload-artifact@v4
        with:
          name: skillscope-${{ matrix.target }}
          path: skillscope-${{ matrix.target }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum skillscope-*.tar.gz > sha256sums.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            skillscope-*.tar.gz sha256sums.txt

      - name: Push formula to plinde/homebrew-tap-private
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          sha() { awk -v f="skillscope-$1.tar.gz" '$2 == f { print $1 }' sha256sums.txt; }
          git clone --depth 1 "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/plinde/homebrew-tap-private.git" tap
          cat > tap/Formula/skillscope.rb <<RUBY
          # Generated by plinde/skillscope .github/workflows/release.yml. Do not edit by hand.
          class Skillscope < Formula
            desc "Skill-invocation analytics over local Claude Code, Codex, pi and opencode transcripts"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/skillscope-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
            end

            on_linux do
              on_intel do
                url "${base}/skillscope-x86_64-unknown-linux-musl.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-musl)"
              end
            end

            def install
              bin.install "skillscope"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/skillscope --version")
            end
          end
          RUBY
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/skillscope.rb
          git commit -m "skillscope ${version}"
          git push origin HEAD:main
