name: Release

# Every merge to main releases, so the hosts' hourly plinde-homebrew-upgrade job
# (plinde/cron-launchagent) installs the latest build. The `tag` job picks the
# next version: minor bump if any `feat` commit since the last v* tag, else
# patch; skipped when main HEAD is already tagged or only *.md changed. If a PR
# already bumped Cargo.toml past the last tag, that version wins. It commits the
# Cargo.toml/Cargo.lock bump to main as `chore(release): vX.Y.Z`, tags that
# commit, and the build + release jobs then run against the tag, so Cargo.toml
# stays the source of truth and the tag/Cargo.toml check below keeps holding.
#
# Triggers: the "Auto-merge on green" step in ci.yml merges with GITHUB_TOKEN,
# and GITHUB_TOKEN pushes start no `push` workflows. So the auto-merge path is
# caught via workflow_run on the CI gate (the merge happens inside that run); a
# human merge fires `push: main`. Both can fire for one merge, and a CI run on
# an unmerged PR also fires workflow_run: the "HEAD already tagged" check makes
# the extra runs no-ops. The bump commit and tag are pushed with GITHUB_TOKEN,
# so they start no further runs (no loop); that is also why tagging and the
# release share this workflow run. A manual `v*` tag push still releases exactly
# that tag.
#
# A `v*` tag builds skillscope for each Homebrew target, publishes a GitHub
# Release with the tarballs, and pushes Formula/skillscope.rb to the private
# tap plinde/homebrew-tap-private.
#
# Same trust stance as ci.yml: no third-party actions. rustup on the runners
# reads rust-toolchain.toml; the release and tap push are plain gh/git. The one
# third-party artifact is the cargo-zigbuild image, pinned by digest.
#
# Targets (all built on ubuntu-latest; macOS runners bill at 10x):
#   aarch64-apple-darwin       sickboy, renton. Cross-built with cargo-zigbuild
#                              in its pinned Docker image (ZIGBUILD_IMAGE). The
#                              image ships a macOS SDK (SDKROOT), which the link
#                              needs: chrono -> iana-time-zone -> core-foundation-sys
#                              links the CoreFoundation framework, and zig alone
#                              only has libSystem stubs. zig's MachO linker
#                              ad-hoc signs arm64 macOS output itself (flags
#                              adhoc,linker-signed), which the kernel requires;
#                              the build step asserts LC_CODE_SIGNATURE is there
#                              since a Linux runner cannot exec the binary.
#   x86_64-unknown-linux-musl  behemoth. Static, so it runs on any glibc
#                              (behemoth is Ubuntu 18.04, glibc 2.27).
#
# Needs the TAP_GITHUB_TOKEN repo secret (Contents:write on the tap).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # PRs touching the build inputs build + smoke only (no release, no tap push), so a
  # broken target shows up before the tag. A manual run releases if main has
  # unreleased changes, else it builds + smokes main.
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump Cargo.toml, commit, tag
        id: tag
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git describe --exact-match --tags --match 'v*' HEAD >/dev/null 2>&1; then
            echo "HEAD already tagged; nothing to release"; exit 0
          fi
          last="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)"
          range="$last..HEAD"; [ "$last" = v0.0.0 ] && range=HEAD
          if [ "$last" != v0.0.0 ] && [ -z "$(git diff --name-only "$range" -- . ':(exclude)*.md')" ]; then
            echo "only docs changed since $last; skipping"; exit 0
          fi
          IFS=. read -r major minor patch <<<"${last#v}"
          # Breaking change (`type!:` subject or `BREAKING CHANGE:` footer) -> major,
          # or minor while 0.x; feat -> minor; anything else -> patch.
          if git log --format='%s%n%b' "$range" | grep -v '^chore(release):' | grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:'; then
            if [ "$major" -ge 1 ]; then major=$((major + 1)); minor=0; else minor=$((minor + 1)); fi
            patch=0
          elif git log --format=%s "$range" | grep -v '^chore(release):' | grep -qE '^feat(\(|:|!)'; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          next="v${major}.${minor}.${patch}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          # A PR that already bumped Cargo.toml past the last tag picks the version.
          if [ "v$cargo_version" != "$last" ] && ! git rev-parse -q --verify "refs/tags/v$cargo_version" >/dev/null; then
            next="v$cargo_version"
          fi
          version="${next#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$cargo_version" != "$version" ]; then
            # Only the [package] version (the first `version =` line) and this
            # crate's Cargo.lock entry change; dependency versions are untouched.
            perl -0pi -e "s/^version = \"[^\"]*\"/version = \"$version\"/m" Cargo.toml
            perl -0pi -e "s/(name = \"skillscope\"\nversion = )\"[^\"]*\"/\$1\"$version\"/" Cargo.lock
            git add Cargo.toml Cargo.lock
            git commit -m "chore(release): $next"
          fi
          git tag -a "$next" -m "release $next"
          # Atomic: if main moved under us, neither the bump nor the tag lands
          # and the next merge's run releases instead.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$next"
          echo "tagged $next (from $last)"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    # Runs for PR smoke builds, manual v* tag pushes, a tag cut by the `tag` job,
    # and manual runs (smoke main when there was nothing to release). A
    # merge/workflow_run with nothing to release skips the build entirely.
    if: >-
      always() && needs.tag.result != 'failure' && needs.tag.result != 'cancelled' && (
        github.event_name == 'pull_request' ||
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v') ||
        needs.tag.outputs.tag != '' )
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            zigbuild: true
          - target: x86_64-unknown-linux-musl
            zigbuild: false
    runs-on: ubuntu-latest
    env:
      # cargo-zigbuild 0.23.4 (zig 0.16.0, MacOSX11.3 SDK), pinned by digest.
      # rustup inside the image still honours rust-toolchain.toml.
      ZIGBUILD_IMAGE: ghcr.io/rust-cross/cargo-zigbuild:0.23.4@sha256:d8313491ec5798de0633fdc1c5753761bff79967bea69076020dc78121b2cca8
      TAG: ${{ needs.tag.outputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag cut by the `tag` job; empty = the event's own ref.
          ref: ${{ needs.tag.outputs.tag }}

      - name: Tag matches Cargo.toml version
        if: env.TAG != ''
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$want" = "$TAG" ] || { echo "::error::tag $TAG != Cargo.toml $want"; exit 1; }

      - name: Install pinned toolchain and target
        if: ${{ !matrix.zigbuild }}
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.zigbuild }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke
        if: ${{ !matrix.zigbuild }}
        run: target/${{ matrix.target }}/release/skillscope --version

      # Can't exec a Mach-O here, so the smoke is: it is an arm64 Mach-O and
      # carries the embedded (ad-hoc) code signature the kernel insists on.
      - name: Build (cargo-zigbuild) and check signature
        if: ${{ matrix.zigbuild }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm -v "$PWD":/io -w /io -e TARGET "$ZIGBUILD_IMAGE" sh -euc '
            rustup target add "$TARGET"
            cargo zigbuild --release --locked --target "$TARGET"
            bin="target/$TARGET/release/skillscope"
            file "$bin" | grep -q "Mach-O 64-bit arm64 executable"
            llvm-objdump-19 --macho --private-headers "$bin" | grep -q LC_CODE_SIGNATURE
            echo "ok: $(file -b "$bin"), LC_CODE_SIGNATURE present"
          '

      - name: Package
        run: tar -czf skillscope-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release skillscope

      - uses: actions/upload-artifact@v4
        with:
          name: skillscope-${{ matrix.target }}
          path: skillscope-${{ matrix.target }}.tar.gz

  release:
    needs: [tag, build]
    if: >-
      always() && needs.build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || needs.tag.outputs.tag != '')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum skillscope-*.tar.gz > sha256sums.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --generate-notes \
            skillscope-*.tar.gz sha256sums.txt

      - name: Push formula to plinde/homebrew-tap-private
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          sha() { awk -v f="skillscope-$1.tar.gz" '$2 == f { print $1 }' sha256sums.txt; }
          git clone --depth 1 "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/plinde/homebrew-tap-private.git" tap
          cat > tap/Formula/skillscope.rb <<RUBY
          # Generated by plinde/skillscope .github/workflows/release.yml. Do not edit by hand.
          class Skillscope < Formula
            desc "Skill-invocation analytics over local Claude Code, Codex, pi and opencode transcripts"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/skillscope-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
            end

            on_linux do
              on_intel do
                url "${base}/skillscope-x86_64-unknown-linux-musl.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-musl)"
              end
            end

            def install
              bin.install "skillscope"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/skillscope --version")
            end
          end
          RUBY
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/skillscope.rb
          git commit -m "skillscope ${version}"
          git push origin HEAD:main
